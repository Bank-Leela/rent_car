name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rent_car
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rent_car?schema=public
      AUTH_SECRET: ci-secret-not-used
      NEXTAUTH_URL: http://localhost:3000
      # Scheduling (จัดรอบ / trip-legs) computes day boundaries in server-local
      # time — pin CI to the production zone so tests match prod, not the UTC runner.
      TZ: Asia/Bangkok

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npx tsc --noEmit
      - run: npm run lint
      # vitest.config.ts sets fileParallelism: false, so bare `npm test` is
      # serialized here exactly as `make test` runs it locally.
      - run: npm test
